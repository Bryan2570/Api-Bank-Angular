<div class="date-range-container">
  <h2>Generar reporte de movimientos</h2>

  <form [formGroup]="formReport" (ngSubmit)="generateReportPDF()" class="date-range-form">

    <div class="form-group">
      <label for="cliente">Cliente</label>
      <select id="cliente" formControlName="cliente">
        <option value="">Seleccione un cliente</option>
        <option *ngFor="let client of clients" [value]="client.idCliente">
          {{ client.nombre }}
        </option>
      </select>
    </div>

    <div class="form-group">
      <label for="fechaInicio">Fecha inicio</label>
      <input type="date" id="fechaInicio" formControlName="fechaInicio" />
    </div>

    <div class="form-group">
      <label for="fechaFin">Fecha fin</label>
      <input type="date" id="fechaFin" formControlName="fechaFin" />
    </div>

    <button type="submit" class="btn-primary">Generar reporte PDF</button>
  </form>
</div>
